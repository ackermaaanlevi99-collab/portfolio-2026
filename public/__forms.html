<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow">
    <title>Formulario de contacto</title>
  </head>
  <body>
    <form name="contacto-portafolio" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contacto-portafolio">
      <p hidden>
        <label>Deja este campo vacío<input name="bot-field" type="text"></label>
      </p>
      <label>Nombre<input name="nombre" type="text"></label>
      <label>Email<input name="email" type="email"></label>
      <label>Tipo de proyecto<select name="servicio"><option value="">Selecciona una opción</option></select></label>
      <label>Mensaje<textarea name="mensaje"></textarea></label>
      <button type="submit">Enviar</button>
    </form>
  </body>
</html>
